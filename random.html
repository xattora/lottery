<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="random.css">
</head>
<body>
    <h1>Lottery</h1>
    <p>Note: Input the number 1 to 100. If the your Input number = Rolling Number, you win 60x of the amount you bet. Else you lose them.</p>
    <div>
        <label for="" id="labelNum">0</label><br><br>
        <label for="betNumber">Required: Enter the amount you want to bet: </label>
        <input type="number" id="betNumber" placeholder="Enter The Amount...."><br><br>
        <label for="inputNum">Enter Your Lucky Number: </label>
        <input type="number" id="inputNum" placeholder="Enter Number 1 to 100...."><br><br> 
        <button id="rollBut">Roll</button><br><br>
        <p>Your Number: <span id="yourNum"></span></p>
        <p id="result">Start The Game</p>
         <button id="resBut">Reset</button><br><br>
        <p id="credit">Created by Xattora</p>
    </div>
    <script src="random.js"></script>
</body>
</html>
